name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # setup-python no longer supplies 3.9 for ubuntu-latest (26.04).
        # Pin compatible runner images so the supported 3.9/3.13 matrix runs.
        os: [ubuntu-24.04, macos-15-intel]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s router-dashboard/tests
      - run: python scripts/check_release.py
